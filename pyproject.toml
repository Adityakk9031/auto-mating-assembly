[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automate-cad"
version = "0.1.0"
description = "SE(3)-invariant B-Rep assembly auto-mating for STEP files using Open CASCADE (OCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cadquery-ocp>=8.0",
    "build123d>=0.13",
    "numpy>=2.0",
    "scipy>=1.14",
    "networkx>=3.0",
    "vtk>=9.3",
    "pillow>=11.0",
    "matplotlib>=3.9",
]

[project.scripts]
automate = "automate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
